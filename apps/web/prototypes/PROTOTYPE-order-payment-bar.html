<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE: Mobile order payment bar</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<!--
  Question: how should money + "Take payment" look on the phone order screen (MobileOrderDetail)?
  Today: MoneyCard in the page (total, Accounts link, PaidBar, paid / balance) + BottomBar (print icon, Take payment · balance).
  Five variants, switch with the bar at the bottom or the arrow keys. "All" shows them side by side. Throwaway.
-->
<style>
  :root { --brand:#1f4fd8; --brand-strong:#163ba6; --brand-soft:#e6ecff; --navy:#13235b; --surface:#f4f6fb; --panel:#fff;
          --muted:#5a6478; --line:#e3e7f0; --warn:#b4380b; --ok:#0f6b5f; --track:#dfe4ef; --ink:#14192b; --fd:'Noto Serif Bengali','Noto Sans Bengali',serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:#d4dae8; font-family:'Noto Sans Bengali',system-ui,sans-serif; color:var(--ink); padding:14px 14px 90px; }
  .stage { display:flex; gap:22px; justify-content:center; flex-wrap:wrap; }
  .slot { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cap { font:700 12px system-ui; letter-spacing:.04em; text-transform:uppercase; color:#46506a; text-align:center; max-width:340px; }
  .cap em { display:block; font-style:normal; font-weight:400; text-transform:none; letter-spacing:0; color:#5d6781; margin-top:2px; }
  .phone { width:375px; height:min(740px, calc(100vh - 150px)); min-height:520px; background:var(--surface); border-radius:30px; border:8px solid #101528; position:relative; overflow:hidden; }
  .scroll { height:100%; overflow-y:auto; padding:14px 14px 150px; display:flex; flex-direction:column; gap:12px; }
  .num { font-family:var(--fd); }
  .sec { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px; }
  .cust { display:flex; align-items:center; gap:10px; }
  .av { width:44px; height:44px; border-radius:50%; background:#dfe7ff; color:var(--brand-strong); display:grid; place-items:center; font:600 18px var(--fd); }
  .cust b { font-size:16px; } .cust small { display:block; color:var(--muted); font-size:13px; }
  .ic { width:44px; height:44px; border-radius:14px; border:1px solid var(--line); display:grid; place-items:center; margin-left:auto; font-size:18px; }
  .garment { display:flex; flex-direction:column; gap:6px; }
  .garment .h { display:flex; justify-content:space-between; font-weight:600; }
  .garment .d { color:var(--muted); font-size:13px; }
  .chip { font-size:12px; border-radius:999px; padding:2px 10px; background:var(--surface); border:1px solid var(--line); }
  .bar { height:7px; border-radius:99px; background:var(--track); overflow:hidden; } .bar i { display:block; height:100%; background:var(--ok); border-radius:99px; }
  .muted { color:var(--muted); } .sm { font-size:13px; } .xs { font-size:12px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  .link { color:var(--brand-strong); font-weight:600; font-size:14px; }
  /* bottom bar shell */
  .bb { position:absolute; left:0; right:0; bottom:0; padding:10px 14px 16px; background:rgba(255,255,255,.96); border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .bb.col { flex-direction:column; align-items:stretch; }
  .print { width:54px; height:54px; flex:none; border-radius:16px; border:1px solid var(--line); background:#fff; display:grid; place-items:center; font-size:20px; }
  .take-soft { flex:1.4; min-height:54px; border-radius:16px; background:var(--brand-soft); color:var(--brand-strong); font:700 16px 'Noto Sans Bengali'; display:flex; align-items:center; justify-content:center; border:0; }
  .take { flex:1; min-height:54px; border-radius:16px; background:var(--brand); color:#fff; font:700 16px 'Noto Sans Bengali'; display:flex; align-items:center; justify-content:center; gap:8px; border:0; }
  .take b { font-family:var(--fd); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .leader { display:flex; align-items:baseline; gap:6px; padding:5px 0; }
  .leader span.dots { flex:1; border-bottom:1.5px dotted #b8c0d2; transform:translateY(-3px); }
  /* switcher */
  .sw { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#101528; color:#fff; border-radius:999px; padding:6px 8px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 24px #0006; font:600 14px system-ui; z-index:10; }
  .sw button { background:#2a3150; color:#fff; border:0; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; }
  .sw button.all { width:auto; padding:0 12px; border-radius:999px; font:600 13px system-ui; }
  .sw span { min-width:190px; text-align:center; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="sw"><button id="prev">←</button><span id="lbl"></span><button id="next">→</button><button class="all" id="all">All</button></div>

<script>
// Sample order: total ৳৪৫,০০০, discount ৳৫০০, paid ৳২৮,০০০, balance ৳১৬,৫০০
const pct = 63;

const head = `
  <div class="sec cust"><div class="av">র</div><div><b>রহিম উদ্দিন</b><small>অর্ডার #১০৪২ · ডেলিভারি ১২ অক্টোবর</small></div><div class="ic">📞</div></div>`;
const rest = `
  <div class="row" style="padding:0 2px"><span class="chip">● চলছে</span><span class="muted sm">৩টির মধ্যে ১টি তৈরি</span></div>
  <div class="garment sec"><div class="h"><span>পাঞ্জাবি</span><span class="chip">কাটা</span></div><div class="d">বুক ৩৮½ · লম্বা ৪৫ · ২টি</div></div>
  <div class="garment sec"><div class="h"><span>পায়জামা</span><span class="chip">সেলাই</span></div><div class="d">কোমর ৩২¼ · লম্বা ৩৯ · ২টি</div></div>
  <div class="garment sec"><div class="h"><span>ওয়েস্টকোট</span><span class="chip">বুক করা</span></div><div class="d">বুক ৩৮½ · লম্বা ২৬ · ১টি</div></div>`;

const variants = [
 { key:'Current', note:'Money card in the page, print icon + "Take payment · amount" in the bar.',
   body: head + `
   <div class="sec" style="display:flex;flex-direction:column;gap:10px;padding:14px">
     <div class="row"><span class="muted sm">মোট <span class="num">৳ ৪৫,০০০</span> <span class="xs">ছাড় ৳ ৫০০</span></span><span class="link">হিসাব</span></div>
     <div class="bar"><i style="width:${pct}%"></i></div>
     <div class="row"><div><div class="xs muted">পরিশোধ</div><div class="num ok" style="font-size:20px;font-weight:700">৳ ২৮,০০০</div></div>
       <div style="text-align:right"><div class="xs muted">বাকি</div><div class="num warn" style="font-size:20px;font-weight:700">৳ ১৬,৫০০</div></div></div>
   </div>` + rest,
   bar: `<div class="bb"><div class="print">🖨</div><button class="take-soft">পেমেন্ট নিন · <span class="num">৳ ১৬,৫০০</span></button></div>` },

 { key:'A', name:'Balance hero', note:'The number the tailor cares about, balance due, becomes the headline of the card. Paid and total drop to a quiet line. One strong filled button.',
   body: head + `
   <div class="sec" style="padding:16px;display:flex;flex-direction:column;gap:8px">
     <div class="row"><span class="muted sm">বাকি আছে</span><span class="link">হিসাব</span></div>
     <div class="num warn" style="font-size:42px;font-weight:700;line-height:1.1">৳ ১৬,৫০০</div>
     <div class="bar" style="height:10px"><i style="width:${pct}%"></i></div>
     <div class="row sm muted"><span><span class="num ok" style="font-weight:700">৳ ২৮,০০০</span> পরিশোধ</span><span>মোট <span class="num">৳ ৪৫,০০০</span></span></div>
     <div class="xs muted">ছাড় ৳ ৫০০ ধরা হয়েছে</div>
   </div>` + rest,
   bar: `<div class="bb"><div class="print">🖨</div><button class="take">পেমেন্ট নিন</button></div>` },

 { key:'B', name:'Money lives in the bar', note:'No card in the page, so garments move up. The bar carries a slim progress strip with paid / total. Tap the strip for Accounts.',
   body: head + rest + rest.split('<div class="garment').slice(1,2).map(g=>'<div class="garment'+g).join(''),
   bar: `<div class="bb col" style="gap:8px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="row sm"><span><span class="num ok" style="font-weight:700">৳ ২৮,০০০</span> <span class="muted">/ <span class="num">৳ ৪৫,০০০</span></span></span><span class="link">হিসাব ›</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
      <div style="display:flex;gap:10px"><div class="print">🖨</div><button class="take-soft" style="flex:1">পেমেন্ট নিন · <span class="num">৳ ১৬,৫০০</span></button></div>
    </div>` },

 { key:'C', name:'Ring + quick amounts', note:'A progress ring with the percent paid. The bar offers shortcut amounts (whole balance, half, other) so a common payment is one tap plus the dialog.',
   body: head + `
   <div class="sec" style="display:flex;gap:16px;align-items:center;padding:14px">
     <div style="position:relative;width:96px;height:96px;flex:none">
       <svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--track)" stroke-width="10"/>
       <circle cx="48" cy="48" r="40" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*40*pct/100).toFixed(1)} 999" transform="rotate(-90 48 48)"/></svg>
       <div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700">৬৩%</div>
     </div>
     <div style="flex:1;display:flex;flex-direction:column;gap:6px">
       <div class="row"><span class="muted sm">মোট</span><span class="num" style="font-weight:700">৳ ৪৫,০০০</span></div>
       <div class="row"><span class="muted sm">পরিশোধ</span><span class="num ok" style="font-weight:700">৳ ২৮,০০০</span></div>
       <div class="row"><span class="muted sm">বাকি</span><span class="num warn" style="font-weight:700;font-size:18px">৳ ১৬,৫০০</span></div>
       <span class="link" style="align-self:flex-end">হিসাব ›</span>
     </div>
   </div>` + rest,
   bar: `<div class="bb col" style="gap:8px">
      <div style="display:flex;gap:8px">
        <button class="chip num" style="flex:1;min-height:40px;font-size:14px;white-space:nowrap;background:var(--brand-soft);color:var(--brand-strong);border-color:#c9d6ff;font-weight:700">পুরো ১৬,৫০০</button>
        <button class="chip num" style="flex:1;min-height:40px;font-size:14px;white-space:nowrap;font-weight:700">অর্ধেক ৮,২৫০</button>
        <button class="chip" style="flex:1;min-height:40px;font-size:15px;font-weight:700">অন্য…</button>
      </div>
      <div style="display:flex;gap:10px"><div class="print">🖨</div><button class="take">পেমেন্ট নিন</button></div>
    </div>` },

 { key:'D', name:'Ledger slip', note:'Reads like the printed receipt: total, discount, paid, balance with dotted leaders. Fully itemised so there is no need to open Accounts for the basics. Bar is calm.',
   body: head + `
   <div class="sec" style="padding:14px 16px">
     <div class="row" style="margin-bottom:4px"><b>হিসাব</b><span class="chip" style="background:#fdeee6;color:var(--warn);border-color:#f6d3c1">বাকি আছে</span></div>
     <div class="leader"><span class="muted">মোট</span><span class="dots"></span><span class="num" style="font-weight:600">৳ ৪৫,০০০</span></div>
     <div class="leader"><span class="muted">ছাড়</span><span class="dots"></span><span class="num" style="font-weight:600">− ৳ ৫০০</span></div>
     <div class="leader"><span class="muted">পরিশোধ</span><span class="dots"></span><span class="num ok" style="font-weight:700">৳ ২৮,০০০</span></div>
     <div class="bar" style="margin:8px 0"><i style="width:${pct}%"></i></div>
     <div class="leader" style="padding-top:2px"><b>বাকি</b><span class="dots"></span><span class="num warn" style="font-weight:700;font-size:22px">৳ ১৬,৫০০</span></div>
     <div style="text-align:right;margin-top:4px"><span class="link">সব পেমেন্ট দেখুন ›</span></div>
   </div>` + rest,
   bar: `<div class="bb"><div class="print">🖨</div><button class="take-soft">পেমেন্ট নিন · <span class="num">৳ ১৬,৫০০</span></button></div>` },
];

const stage = document.getElementById('stage'), lbl = document.getElementById('lbl');
let cur = Math.max(0, Number(new URLSearchParams(location.search).get('v') ?? 0)), all = false;
function slot(v) {
  return `<div class="slot"><div class="cap">${v.key}${v.name ? ' · ' + v.name : ''}<em>${v.note}</em></div>
    <div class="phone"><div class="scroll">${v.body}</div>${v.bar}</div></div>`;
}
function render() {
  stage.innerHTML = (all ? variants : [variants[cur]]).map(slot).join('');
  lbl.textContent = all ? 'All variants' : `${variants[cur].key}${variants[cur].name ? ' (' + variants[cur].name + ')' : ''}`;
}
const go = d => { all = false; cur = (cur + d + variants.length) % variants.length; render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('all').onclick = () => { all = !all; render(); };
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
render();
</script>
</body>
</html>
